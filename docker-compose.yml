services:
  https:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    image: gpt-pro-cloud-caddy:local
    container_name: gpt-pro-cloud-caddy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST?请在 .env 中设置 PUBLIC_HOST}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID?请在 .env 中设置 TENCENTCLOUD_SECRET_ID}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY?请在 .env 中设置 TENCENTCLOUD_SECRET_KEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "443:443"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: gpt-pro-cloud-gateway:local
    container_name: gpt-pro-cloud-gateway
    environment:
      PORT: "8080"
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      STATE_FILE: /data/state.json
      SESSIONS_FILE: /data/sessions.json
      DESKTOP_CDP: http://desktop:9223
      DESKTOP_VNC: http://desktop:3000
      MAINTENANCE_LISTEN_PORT: "8081"
      MAINTENANCE_HOST_PORT: ${MAINTENANCE_PORT:-36091}
      VNC_USER: abc
      VNC_PASSWORD: ${VNC_PASSWORD:-gpc-internal}
      FRAME_ACTIVE_FPS: ${FRAME_ACTIVE_FPS:-60}
      JPEG_QUALITY: ${JPEG_QUALITY:-72}
      TRANSFER_ROOT: /transfer
      TRANSFER_STATE_FILE: /data/transfers.json
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-536870912}
      TRANSFER_QUOTA_BYTES: ${TRANSFER_QUOTA_BYTES:-4294967296}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      PROFILE_AUTO_DETECT: ${PROFILE_AUTO_DETECT:-true}
      PROFILE_GEO_ENDPOINT: ${PROFILE_GEO_ENDPOINT:-https://ipwho.is/?fields=success,country_code,timezone.id}
      PROFILE_GEO_TIMEOUT_MS: ${PROFILE_GEO_TIMEOUT_MS:-5000}
      PROFILE_TIMEZONE: ${PROFILE_TIMEZONE:-}
      PROFILE_LOCALE: ${PROFILE_LOCALE:-}
      PORTAL_GATEWAY_SOCKET: /run/gpc/gateway.sock
      PORTAL_DESKTOP_SOCKET: /run/gpc/desktop.sock
    volumes:
      - ./data-panel:/data
      - ./data-transfer:/transfer
      - portal-runtime:/run/gpc
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-36090}:8080"
      - "127.0.0.1:${MAINTENANCE_PORT:-36091}:8081"
    depends_on:
      desktop:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  desktop:
    build: ./docker
    image: gpt-pro-cloud-desktop:local
    container_name: gpt-pro-cloud-desktop
    cap_add:
      - SYS_ADMIN
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      CUSTOM_USER: abc
      PASSWORD: ${VNC_PASSWORD:-gpc-internal}
      TITLE: GPT Pro
      START_URL: ${START_URL:-https://chatgpt.com}
      PROXY_URL: ${PROXY_URL:-}
      GPC_CDP_ALLOW: gateway,gpt-pro-cloud-gateway
      LIBGL_ALWAYS_SOFTWARE: "1"
      NO_DECOR: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/browser:/config
      - ./data-transfer:/transfer
      - portal-runtime:/run/gpc
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '/usr/local/bin/gpc-file-portal' >/dev/null && pgrep -f '^/usr/libexec/xdg-desktop-portal$' >/dev/null && test -S /run/gpc/desktop.sock && curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  caddy-data:
  caddy-config:
  portal-runtime:
